name: Compile and run technical examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Maven 3.9.9
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          server-id: github-nm-packages
      - name: Fetch the already-public starter trial license for this CI run
        run: |
          mkdir -p license
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/nmltd/new-algoquant-project/main/license/nm.lic --output license/nm.lic
      - name: Download public AlgoQuant and compile all examples from a fresh cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn -B -ntp -U -Dmaven.repo.local="$RUNNER_TEMP/m2" clean verify
      - name: Run every example with synthetic data and no desktop or market-data service
        run: bash scripts/run-offline.sh
      - name: Check browser JavaScript syntax
        run: |
          node --check src/main/resources/web/sma2/app.js
          node --check src/main/resources/web/shared/report.js
          node --check src/main/resources/web/performance/app.js
      - name: Verify the SMA2 web API offline
        run: python3 web/smoke.py
      - name: Verify report navigation and interactive charts in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/sma2-browser" --no-save --ignore-scripts playwright@1.62.1
          NODE_PATH="$RUNNER_TEMP/sma2-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node web/browser-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/sma2-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node web/performance-browser.cjs
      - name: Verify Yahoo-backed web backtest on an explicit manual run
        if: github.event_name == 'workflow_dispatch'
        run: python3 web/smoke.py --live
      - name: Build the Cloud Run container and check its health endpoint
        run: |
          mkdir -p web/build
          cp -r target/classes target/lib web/build/
          docker build -t sma2-web:ci web
          docker run -d --name sma2-web -p 18082:8080 -e SMA2_DATA_MODE=synthetic -v "$PWD/license:/secrets:ro" sma2-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:18082/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18082/api/health
          curl -fsS -X POST -d 'symbol=AAPL&start=2020-01-01&end=2020-12-31&fast=5&slow=20' http://localhost:18082/api/backtest > target/web-reports/container.json
          REPORT_ID=$(python -c 'import json;print(json.load(open("target/web-reports/container.json"))["reportId"])')
          if ! curl --max-time 60 -fsS "http://localhost:18082/sma2/api/reports/$REPORT_ID/report.xlsx" -o target/web-reports/container.xlsx; then
            docker logs sma2-web
            exit 1
          fi
          docker stop sma2-web
      - name: Upload built Cloud Run container context (no license)
        uses: actions/upload-artifact@v4
        with:
          name: sma2-web-container-context
          path: |
            web/Dockerfile
            web/logback.xml
            web/build/
          retention-days: 14
      - name: Upload web verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sma2-web-verification
          path: |
            target/web-reports/
            target/surefire-reports/
      - name: Upload generated simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: log/
          if-no-files-found: warn
